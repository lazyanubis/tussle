[package]
name = "tussle-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bitflags = "2.13.1"
plist = { version = "1.10.0", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
ctrlc = "3.5.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSEnumerator"] }
